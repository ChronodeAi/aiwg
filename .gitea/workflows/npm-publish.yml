# npm Package Publishing — Gitea registry only (npmjs.org publishes from GitHub)
#
# Publishes exact retained-RC packages to Gitea's bundled npm registry after an
# evidence-bearing dispatch against a signed stable tag. Stable tag pushes fail
# closed. Uses CalVer versioning: vYYYY.M.PATCH.
#
# npmjs.org is NOT published or verified from here. The public-registry publish
# (OIDC trusted publishing + provenance) and its verification are owned by
# .github/workflows/npm-publish.yml. GitHub Actions is the authority for
# npmjs.org supply-chain distribution and verification; this Gitea workflow
# owns the Gitea npm registry (local package management) only.
#
# REQUIRED TRACKER SECRETS:
#   VAULT_CI_ROLE_ID, VAULT_CI_SECRET_ID - vault AppRole bootstrap pair.
#
# The dedicated read-scoped GitHub authenticated-user API credential for
# retained-RC/comparison/approval evidence is fetched from vault only after the
# versioned promotion policy passes its offline activation preflight.
#
# vault fetch specs:
#   ci/vault-fetch.npm-publish.spec          -> NODE_AUTH_TOKEN
#   ci/vault-fetch.npm-publish-evidence.spec -> AIWG_GITHUB_RELEASE_EVIDENCE_TOKEN_FILE
#
# To publish a new version:
#   1. Update version in package.json
#   2. Commit: git commit -am "release: vYYYY.M.PATCH"
#   3. Tag: tools/release/cut-tag.sh YYYY.M.PATCH
#   4. Push both signed tags, then dispatch this workflow with --ref set to the
#      stable tag and every required evidence input.
#
# Note:
# - Gitea release creation is handled by .gitea/workflows/gitea-release.yml
# - GitHub release creation is handled by .gitea/workflows/github-mirror.yml

name: Publish to Gitea npm registry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_to_publish:
        description: 'Existing signed stable tag (dispatch with --ref set to the same tag)'
        required: true
        type: string
      rc_tag:
        description: 'Signed RC tag resolving to the same commit'
        required: true
        type: string
      rc_run_id:
        description: 'Successful retained-RC workflow run ID'
        required: true
        type: string
      rc_artifact_id:
        description: 'Retained-RC artifact ID from that run'
        required: true
        type: string
      comparison_run_id:
        description: 'Successful trusted current-quarter comparison/validation workflow run ID'
        required: true
        type: string
      comparison_artifact_id:
        description: 'Current-quarter full-validation and three-provider comparison artifact ID'
        required: true
        type: string
      approval_issue:
        description: 'GitHub issue containing the authenticated approval receipt'
        required: true
        type: string
      approval_sha256:
        description: 'SHA-256 of the exact authenticated approval comment body'
        required: true
        type: string
concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  GITEA_NPM_REGISTRY: https://git.integrolabs.net/api/packages/roctinam/npm/
  NODE_VERSION: '24'

jobs:
  build-and-publish:
    name: Publish exact retained RC
    if: ${{ !contains(github.ref, '-') && secrets.VAULT_CI_ROLE_ID != '' && secrets.VAULT_CI_SECRET_ID != '' }}
    runs-on: ubuntu-latest
    container: node:24@sha256:050bf2bbe33c1d6754e060bec89378a79ed831f04a7bb1a53fe45e997df7b3bb  # node 24.15.0 (see ci/digests.txt)
    # Stable publication is the only active npm publication lane.
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Resolve release tag
        id: release_tag
        env:
          INPUT_TAG_TO_PUBLISH: ${{ github.event.inputs.tag_to_publish }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Stable tag pushes cannot supply authenticated retained-RC evidence." >&2
            echo "Recovery: dispatch this workflow with --ref <stable-tag> and every required evidence input." >&2
            exit 1
          fi
          RELEASE_TAG="${INPUT_TAG_TO_PUBLISH:-}"
          if ! echo "$RELEASE_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Stable release tag must match vYYYY.M.PATCH: ${RELEASE_TAG:-<empty>}"
            exit 1
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $RELEASE_TAG"

      - name: Verify workflow identity is tag-bound
        run: |
          set -euo pipefail
          TAG='${{ steps.release_tag.outputs.release_tag }}'
          EXPECTED_REF="refs/tags/${TAG}"
          if [ "$GITHUB_REF" != "$EXPECTED_REF" ]; then
            echo "Release publication requires a tag-bound workflow identity." >&2
            echo "Observed GITHUB_REF: $GITHUB_REF" >&2
            echo "Expected GITHUB_REF: $EXPECTED_REF" >&2
            exit 1
          fi

      - name: Fetch tag object for signature verification
        # Force-fetch the annotated tag object before signature verification.
        env:
          RC_TAG: ${{ github.event.inputs.rc_tag }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release_tag.outputs.release_tag }}"
          git check-ref-format "refs/tags/${RC_TAG}" >/dev/null
          git fetch origin "+refs/tags/${TAG}:refs/tags/${TAG}" "+refs/tags/${RC_TAG}:refs/tags/${RC_TAG}" --depth=1

      - name: Verify signed tag (#1299 / A9 gate)
        # Hard gate: every release tag must verify against a maintainer
        # public key published in .gitea/keys/ or .gitea/allowed_signers.
        # See tools/ci/verify-signed-tag.sh for the full procedure and
        # docs/contributing/versioning.md for the operator setup.
        env:
          AIWG_VERIFY_TAG_REF: refs/tags/${{ steps.release_tag.outputs.release_tag }}
        run: bash tools/ci/verify-signed-tag.sh

      - name: Checkout release tag
        run: git checkout --detach "refs/tags/${{ steps.release_tag.outputs.release_tag }}"

      - name: Verify source-bound storage benchmark claims (#2191)
        run: npm run verify:storage-claims

      - name: Upgrade npm to ^11.5 for release-age gate (#1290 / A15)
        # The Node 24 base image ships npm 11.x; the `min-release-age`
        # config key from the repo-root .npmrc requires npm 11.5+. This is
        # defense-in-depth: `npm ci` against a current lockfile doesn't
        # re-resolve so the gate is a no-op on a locked install, but a
        # publish workflow is the most security-sensitive moment AIWG has,
        # and we want the gate genuinely active here.
        # See docs/contributing/versioning.md § Release-age policy.
        run: npm install -g npm@^11.5

      - name: Install dependencies
        run: npm ci
      - name: Extract and verify version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.release_tag.outputs.release_tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "Error: Tag ($TAG_VERSION) does not match package.json ($VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Require enabled release promotion policy before credential access
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { assessPromotionPolicyConfiguration } from './tools/release/release-promotion.mjs';

          const policy = JSON.parse(readFileSync('config/release-promotion-policy.json', 'utf8'));
          const assessment = assessPromotionPolicyConfiguration(policy);
          if (!assessment.ready) {
            console.error('Release promotion policy is not active:');
            for (const requirement of assessment.unmet_requirements) console.error(`- ${requirement}`);
            process.exit(1);
          }
          NODE

      - name: Install vault fetch dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl jq

      - name: Fetch Gitea npm token from vault
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          GT_NPM_TOKEN_VAULT_PATH: ${{ vars.GT_NPM_TOKEN_VAULT_PATH }}
          GT_NPM_TOKEN_VAULT_FIELD: ${{ vars.GT_NPM_TOKEN_VAULT_FIELD }}
          VAULT_CI_ROLE_ID: ${{ secrets.VAULT_CI_ROLE_ID }}
          VAULT_CI_SECRET_ID: ${{ secrets.VAULT_CI_SECRET_ID }}
        run: bash ci/vault-fetch.sh --spec ci/vault-fetch.npm-publish.spec

      - name: Fetch dedicated GitHub evidence token from vault
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          AIWG_GITHUB_RELEASE_EVIDENCE_TOKEN_VAULT_PATH: ${{ vars.AIWG_GITHUB_RELEASE_EVIDENCE_TOKEN_VAULT_PATH }}
          AIWG_GITHUB_RELEASE_EVIDENCE_TOKEN_VAULT_FIELD: ${{ vars.AIWG_GITHUB_RELEASE_EVIDENCE_TOKEN_VAULT_FIELD }}
          VAULT_CI_ROLE_ID: ${{ secrets.VAULT_CI_ROLE_ID }}
          VAULT_CI_SECRET_ID: ${{ secrets.VAULT_CI_SECRET_ID }}
        run: bash ci/vault-fetch.sh --spec ci/vault-fetch.npm-publish-evidence.spec

      - name: Authorize and publish exact retained RC to Gitea npm registry
        id: promotion
        env:
          RC_TAG: ${{ github.event.inputs.rc_tag }}
          RC_RUN_ID: ${{ github.event.inputs.rc_run_id }}
          RC_ARTIFACT_ID: ${{ github.event.inputs.rc_artifact_id }}
          COMPARISON_RUN_ID: ${{ github.event.inputs.comparison_run_id }}
          COMPARISON_ARTIFACT_ID: ${{ github.event.inputs.comparison_artifact_id }}
          APPROVAL_ISSUE: ${{ github.event.inputs.approval_issue }}
          APPROVAL_SHA256: ${{ github.event.inputs.approval_sha256 }}
        run: |
          set -euo pipefail
          test -n "${AIWG_GITHUB_RELEASE_EVIDENCE_TOKEN_FILE:-}" || { echo "Dedicated GitHub evidence token file is required" >&2; exit 1; }
          test -f "$AIWG_GITHUB_RELEASE_EVIDENCE_TOKEN_FILE" && test ! -L "$AIWG_GITHUB_RELEASE_EVIDENCE_TOKEN_FILE" || { echo "Dedicated GitHub evidence token file is invalid" >&2; exit 1; }
          test "$(stat -c '%a' "$AIWG_GITHUB_RELEASE_EVIDENCE_TOKEN_FILE")" = 600 || { echo "Dedicated GitHub evidence token file must use mode 0600" >&2; exit 1; }
          case "$AIWG_GITHUB_RELEASE_EVIDENCE_TOKEN_FILE" in
            "$RUNNER_TEMP"/vault-AIWG_GITHUB_RELEASE_EVIDENCE_TOKEN_FILE.*) ;;
            *) echo "Dedicated GitHub evidence token file is outside RUNNER_TEMP" >&2; exit 1 ;;
          esac
          cat > .npmrc << 'NPMRC'
          //git.integrolabs.net/api/packages/roctinam/npm/:_authToken=${NODE_AUTH_TOKEN}
          NPMRC
          RC_DIR=$(mktemp -d "$RUNNER_TEMP/aiwg-rc.XXXXXX")
          CMP_DIR=$(mktemp -d "$RUNNER_TEMP/aiwg-comparison.XXXXXX")
          AIWG_GITHUB_RELEASE_EVIDENCE_TOKEN="$(cat -- "$AIWG_GITHUB_RELEASE_EVIDENCE_TOKEN_FILE")" \
          node tools/release/release-promotion.mjs publish \
            --rc-tag "$RC_TAG" \
            --stable-tag '${{ steps.release_tag.outputs.release_tag }}' \
            --run-id "$RC_RUN_ID" \
            --artifact-id "$RC_ARTIFACT_ID" \
            --comparison-run-id "$COMPARISON_RUN_ID" \
            --comparison-artifact-id "$COMPARISON_ARTIFACT_ID" \
            --approval-issue "$APPROVAL_ISSUE" \
            --approval-sha256 "$APPROVAL_SHA256" \
            --destination "$RC_DIR" --comparison-destination "$CMP_DIR" \
            --registry gitea --receipt "$RUNNER_TEMP/gitea-publication.json" \
            --output "$RUNNER_TEMP/promotion-decision.json"

      - name: Remove dedicated GitHub evidence credential
        if: always()
        run: bash ci/vault-fetch.sh --cleanup

      - name: Preserve promotion decision and partial receipt
        if: always()
        uses: actions/upload-artifact@c24449f33cd45d4826c6702db7e49f7cdb9b551d  # v3.2.1-node20 (ci/digests.txt)
        with:
          name: gitea-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/promotion-decision.json
            ${{ runner.temp }}/gitea-publication.json
          if-no-files-found: warn
          retention-days: 90

      - name: Retire next on Gitea
        run: |
          set -euo pipefail
          cat > .npmrc << 'NPMRC'
          //git.integrolabs.net/api/packages/roctinam/npm/:_authToken=${NODE_AUTH_TOKEN}
          NPMRC
          VERSION="${{ steps.version.outputs.version }}"
          for PACKAGE in aiwg @aiwg/cli @aiwg/cockpit; do
            TAGS=$(npm dist-tag ls "$PACKAGE" --registry=${{ env.GITEA_NPM_REGISTRY }})
            if grep -Eq '^next: ' <<< "$TAGS"; then
              npm dist-tag rm "$PACKAGE" next --registry=${{ env.GITEA_NPM_REGISTRY }}
            fi
            for ATTEMPT in 1 2 3 4 5; do
              TAGS=$(npm dist-tag ls "$PACKAGE" --registry=${{ env.GITEA_NPM_REGISTRY }})
              if grep -Fxq "latest: ${VERSION}" <<< "$TAGS" &&
                 ! grep -Eq '^next: ' <<< "$TAGS"; then
                echo "✓ ${PACKAGE}@latest = ${VERSION}; @next absent on Gitea"
                break
              fi
              if [ "$ATTEMPT" -eq 5 ]; then
                echo "✗ ${PACKAGE} Gitea dist-tags did not converge to latest-only policy"
                echo "$TAGS"
                exit 1
              fi
              sleep 5
            done
          done
      # npmjs.org publishing is owned by .github/workflows/npm-publish.yml
      # (OIDC + provenance); the formerly-disabled Gitea npmjs.org legs were
      # removed now that the OIDC path is proven in production (#1283 / A5).


  verify-install:
    name: Verify Installation
    runs-on: ubuntu-latest
    container: node:24@sha256:050bf2bbe33c1d6754e060bec89378a79ed831f04a7bb1a53fe45e997df7b3bb  # node 24.15.0 (see ci/digests.txt)
    needs: build-and-publish
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Wait for package propagation
        run: sleep 15

      - name: Verify package on Gitea registry
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ env.GITEA_NPM_REGISTRY }}aiwg")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Package aiwg found in Gitea registry"
          else
            echo "✗ Package aiwg not found in Gitea registry (HTTP $HTTP_CODE)"
            exit 1
          fi

          CLI_HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ env.GITEA_NPM_REGISTRY }}%40aiwg%2Fcli")
          if [ "$CLI_HTTP_CODE" = "200" ]; then
            echo "✓ Package @aiwg/cli found in Gitea registry"
          else
            echo "✗ Package @aiwg/cli not found in Gitea registry (HTTP $CLI_HTTP_CODE)"
            exit 1
          fi

          COCKPIT_HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ env.GITEA_NPM_REGISTRY }}%40aiwg%2Fcockpit")
          if [ "$COCKPIT_HTTP_CODE" = "200" ]; then
            echo "✓ Package @aiwg/cockpit found in Gitea registry"
          else
            echo "✗ Package @aiwg/cockpit not found in Gitea registry (HTTP $COCKPIT_HTTP_CODE)"
            exit 1
          fi

      - name: Clean-install Gitea package tarballs
        # Gitea's bundled npm registry is a package store, not an npmjs proxy.
        # Resolve each AIWG tarball from Gitea, then install the tarball with
        # npm's default registry so third-party dependencies remain on npmjs.
        run: |
          set -euo pipefail
          VERSION="${{ needs.build-and-publish.outputs.version }}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid or missing published version from build job: ${VERSION:-<empty>}"
            exit 1
          fi
          ROOT_TARBALL=$(npm view "aiwg@${VERSION}" dist.tarball --registry=${{ env.GITEA_NPM_REGISTRY }})
          CLI_TARBALL=$(npm view "@aiwg/cli@${VERSION}" dist.tarball --registry=${{ env.GITEA_NPM_REGISTRY }})
          COCKPIT_TARBALL=$(npm view "@aiwg/cockpit@${VERSION}" dist.tarball --registry=${{ env.GITEA_NPM_REGISTRY }})

          ROOT_INSTALL=$(mktemp -d)
          npm install --prefix "$ROOT_INSTALL" --no-audit --no-fund "$ROOT_TARBALL"
          "$ROOT_INSTALL/node_modules/.bin/aiwg" --version | grep -F "$VERSION"
          "$ROOT_INSTALL/node_modules/.bin/aiwg" help >/dev/null

          CLI_INSTALL=$(mktemp -d)
          npm install --prefix "$CLI_INSTALL" --no-audit --no-fund "$CLI_TARBALL"
          "$CLI_INSTALL/node_modules/.bin/aiwg" --version | grep -F "$VERSION"
          "$CLI_INSTALL/node_modules/.bin/aiwg" help >/dev/null

          COCKPIT_INSTALL=$(mktemp -d)
          npm install --prefix "$COCKPIT_INSTALL" --no-audit --no-fund "$COCKPIT_TARBALL"
          test -x "$COCKPIT_INSTALL/node_modules/.bin/aiwg-cockpit"
          test -f "$COCKPIT_INSTALL/node_modules/@aiwg/cockpit/web/dist/index.html"

      # npmjs.org publish + verification is owned by .github/workflows/npm-publish.yml
      # (OIDC + provenance). This Gitea workflow verifies the Gitea registry only.
