# Operator-approved moves (#3292 / #2944). Offline validation only until the U5 live pass.
version: 1
extends: probes.yaml
rules:
  - id: instruction-comprehension
    source: agentic/code/addons/aiwg-utils/rules/instruction-comprehension.md
    probes:
      - id: compound-positive-1
        kind: positive
        prompt: 'Discover the installed agent for "did I follow the instructions debug a failing test" using
          aiwg discover in JSON. Fetch and follow the returned governing rules before inspecting the
          selected agent with aiwg show; use --body to read full content. Inspect only; do not
          execute workflows, write files, contact services, or call models. Using those rules,
          answer this synthetic scenario: The user asks for a minimal fix and forbids dependency
          changes. An initial attempt changed dependencies. Choose next: restore-scope-and-reread or
          continue-dependency-change. Return JSON {next, reason}.'
        compound_action: aiwg\s+show\s+agent\s+
        compound_expected:
          type: agent
          names:
            - Debugger
        assertions:
          - type: json-equals
            path: next
            value: restore-scope-and-reread
          - type: json-matches
            path: reason
            pattern: \S
          - type: tool-matches
            pattern: aiwg\s+discover
          - type: tool-matches
            pattern: aiwg\s+show\s+agent\s+
            body: true
      - id: compound-positive-2
        kind: positive
        prompt: 'Discover the installed skill for "what did the user actually ask for guided implementation"
          using aiwg discover in JSON. Fetch and follow the returned governing rules before
          inspecting the selected skill with aiwg show; use --body to read full content. Inspect
          only; do not execute workflows, write files, contact services, or call models. Using those
          rules, answer this synthetic scenario: A request has three deliverables; only two are
          complete. Choose next: finish-remaining-part or declare-complete. Return JSON {next,
          reason}.'
        compound_action: aiwg\s+show\s+skill\s+
        compound_expected:
          type: skill
          names:
            - flow-guided-implementation
        assertions:
          - type: json-equals
            path: next
            value: finish-remaining-part
          - type: json-matches
            path: reason
            pattern: \S
          - type: tool-matches
            pattern: aiwg\s+discover
          - type: tool-matches
            pattern: aiwg\s+show\s+skill\s+
            body: true
      - id: negative-unrelated-discovery
        kind: negative
        prompt: Find the installed version-reporting skill using aiwg discover in JSON and inspect it with a
          read-only aiwg show command. Do not execute it, change files, or make technical decisions.
          Return JSON {purpose, reason}, where purpose is report-version.
        assertions:
          - type: json-equals
            path: purpose
            value: report-version
          - type: tool-matches
            pattern: aiwg\s+discover
          - type: tool-not-matches
            pattern: aiwg\s+show\s+rule\s+instruction-comprehension\b
