# Lane additions; merge with probes.yaml for the full-suite schema and runner.
# No model calls were run while authoring these U5/U7 probes.
version: 1
rules:
  - id: installer-authoring
    source: agentic/code/addons/agentic-installer/rules/installer-authoring.md
    probes:
      - id: positive-1
        kind: positive
        prompt: While using setup-generate, a deterministic dependency installation can be expressed in
          shell. Choose script-step or agentic-step for its manifest step. This is a decision
          exercise only; do not perform the proposed operation. Return JSON {action, reason}.
        assertions:
          - type: json-equals
            path: action
            value: script-step
          - type: json-matches
            path: reason
            pattern: \S
      - id: positive-2
        kind: positive
        prompt: Review a setup manifest with no recovery_procedures. Choose add-recovery or accept-as-is
          before completing setup-generate. This is a decision exercise only; do not perform the
          proposed operation. Return JSON {action, reason}.
        assertions:
          - type: json-equals
            path: action
            value: add-recovery
          - type: json-matches
            path: reason
            pattern: \S
      - id: negative-1
        kind: negative
        prompt: Compute 8 + 5. This is an arithmetic question only with no tools or workflow work required.
          Return JSON with answer (a number) and reason.
        assertions:
          - type: json-equals
            path: answer
            value: 13
          - type: tool-not-matches
            pattern: (?:aiwg\s+show\s+rule\s+installer-authoring|[\/]rules[\/]installer-authoring\.md)
  - id: installer-safety
    source: agentic/code/addons/agentic-installer/rules/installer-safety.md
